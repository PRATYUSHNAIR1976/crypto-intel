[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-intel"
version = "0.1.0"
description = "Local-first crypto trading intelligence platform for research and education. No live trading."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Every dependency below is free and open source (see docs/ARCHITECTURE.md §B).
dependencies = [
    "httpx>=0.27,<1",              # HTTP client for public market-data endpoints (BSD-3)
    "pandas>=2.2,<3",              # dataframes (BSD-3)
    "numpy>=1.26",                 # numerics (BSD-3)
    "pyarrow>=15",                 # Parquet I/O (Apache-2.0)
    "duckdb>=1.0,<2",              # local analytical SQL over Parquet (MIT)
    "pydantic>=2.6,<3",            # typed models (MIT)
    "pydantic-settings>=2.7,<3",   # .env / env-var config (MIT)
    "fastapi>=0.110",              # local read-only API (MIT)
    "uvicorn>=0.29",               # ASGI server for FastAPI (BSD-3)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cip = "cryptointel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cryptointel = ["validation/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real public market-data APIs (deselected by default; run with -m live)"]
addopts = "-m 'not live'"
